<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon box -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#0f172a"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="url(#g)" stroke-width="1.5"/>

  <!-- Neural nodes -->
  <circle cx="12" cy="18" r="3.5" fill="#7c3aed" filter="url(#glow)" opacity="0.9"/>
  <circle cx="32" cy="10" r="3.5" fill="url(#g)" filter="url(#glow)"/>
  <circle cx="52" cy="18" r="3.5" fill="#06b6d4" filter="url(#glow)" opacity="0.9"/>
  <circle cx="12" cy="46" r="3.5" fill="#7c3aed" filter="url(#glow)" opacity="0.9"/>
  <circle cx="32" cy="54" r="3.5" fill="url(#g)" filter="url(#glow)"/>
  <circle cx="52" cy="46" r="3.5" fill="#06b6d4" filter="url(#glow)" opacity="0.9"/>
  <!-- Central node -->
  <circle cx="32" cy="32" r="7" fill="url(#g)" filter="url(#glow)"/>

  <!-- Connection lines -->
  <line x1="12" y1="18" x2="32" y2="32" stroke="url(#g)" stroke-width="1.2" opacity="0.45"/>
  <line x1="32" y1="10" x2="32" y2="32" stroke="url(#g)" stroke-width="1.2" opacity="0.45"/>
  <line x1="52" y1="18" x2="32" y2="32" stroke="url(#g)" stroke-width="1.2" opacity="0.45"/>
  <line x1="12" y1="46" x2="32" y2="32" stroke="url(#g)" stroke-width="1.2" opacity="0.45"/>
  <line x1="32" y1="54" x2="32" y2="32" stroke="url(#g)" stroke-width="1.2" opacity="0.45"/>
  <line x1="52" y1="46" x2="32" y2="32" stroke="url(#g)" stroke-width="1.2" opacity="0.45"/>
  <line x1="12" y1="18" x2="12" y2="46" stroke="#7c3aed" stroke-width="0.8" opacity="0.25"/>
  <line x1="52" y1="18" x2="52" y2="46" stroke="#06b6d4" stroke-width="0.8" opacity="0.25"/>
  <line x1="12" y1="18" x2="32" y2="10" stroke="url(#g)" stroke-width="0.8" opacity="0.25"/>
  <line x1="52" y1="18" x2="32" y2="10" stroke="url(#g)" stroke-width="0.8" opacity="0.25"/>

  <!-- Text: PURVI -->
  <text x="78" y="30" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="22" font-weight="800" fill="url(#g)" letter-spacing="-0.5">PURVI</text>
  <!-- Text: TECHNOLOGIES -->
  <text x="78" y="50" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" letter-spacing="3.5">TECHNOLOGIES</text>
</svg>
